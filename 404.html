<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Seite nicht gefunden – Jamie's Lens</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="fonts.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', system-ui, sans-serif; font-weight: 300; background: #fafaf8; color: #111110;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
    .tag { font-size: 0.8rem; letter-spacing: 0.2em; text-transform: uppercase; color: #c8a97e; margin-bottom: 1.5rem; }
    h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 300; font-size: clamp(2.5rem, 8vw, 4.5rem); line-height: 1.1; margin-bottom: 1rem; }
    h1 em { font-style: italic; color: #c8a97e; }
    p { color: #6b6b67; max-width: 30rem; margin: 0 auto 2rem; line-height: 1.7; }
    a.btn { display: inline-block; padding: 0.9rem 2rem; background: #111110; color: #fafaf8; text-decoration: none;
            font-size: 0.8rem; letter-spacing: 0.15em; text-transform: uppercase; transition: opacity .2s; }
    a.btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <main>
    <p class="tag">Fehler 404</p>
    <h1>Diese Seite ist <em>verschwunden</em></h1>
    <p>Der gesuchte Moment wurde nicht gefunden. Vielleicht wurde die Seite verschoben oder existiert nicht mehr.</p>
    <a class="btn" href="/">Zurück zur Startseite</a>
  </main>
</body>
</html>
