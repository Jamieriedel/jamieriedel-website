:root{
  --night:#11100F;--surface:#171614;--raised:#1F1D1B;--hover:#262421;--line:#2A2825;--line2:#3A3732;
  --bone:#F4F0E8;--smoke:#ABA499;--dim:#736D63;
  --cA:#2FD44E;--cF:#FF9A1F;--cG:#F0443A;--cB:#B07CFF;--cD:#50DCCD;--cX:#1EA0BE;--cL:#3D9BFF;
  --ok:#4CD07D;--warn:#FFB224;--err:#F0443A;
  --r1:8px;--r2:12px;--r3:18px;
  --bg:var(--night);--bg2:var(--surface);--bg3:var(--raised);--bg4:var(--hover);--fg:var(--bone);--fg2:var(--smoke);--fg3:var(--dim);
  font-family:"Space Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--bone);font-size:13.5px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--bone);outline-offset:2px;border-radius:6px}
body{display:grid;height:100vh;height:100dvh;overflow:hidden;grid-template-columns:var(--side,248px) minmax(0,1fr);grid-template-rows:60px auto 1fr auto;grid-template-areas:"top top" "side bar" "side main" "side detail"}
body.noside{--side:0px}
/* header */
header{grid-area:top;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(17,16,15,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:.02em;white-space:nowrap;margin-right:6px}
.logo small{font-weight:400;color:var(--dim);font-size:13px;letter-spacing:0}
.logo .mark{width:30px;height:30px;border-radius:9px;background:var(--bone);display:grid;place-items:center}
.pills{display:flex;gap:6px;min-width:0;overflow:hidden}
.pill{display:flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:99px;background:transparent;border:1px solid var(--line2);color:var(--smoke);font-size:12.5px;white-space:nowrap;cursor:pointer;transition:border-color .15s,color .15s}
.pill:hover{border-color:var(--dim);color:var(--bone)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.pill.ok .dot{background:var(--ok)}.pill.warn .dot{background:var(--warn)}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--raised);cursor:pointer;white-space:nowrap;font-weight:500;transition:background .15s,border-color .15s,transform .08s}
.btn:hover{background:var(--hover);border-color:#4a463f}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.38;cursor:not-allowed;transform:none}
.btn.primary{background:var(--bone);color:var(--night);border-color:var(--bone);font-weight:600}
.btn.primary:hover{background:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--raised)}
.btn.icon{width:36px;padding:0}
.btn.sm{height:30px;padding:0 11px;font-size:12.5px;border-radius:8px}
.btn.okb{border-color:#2f5a3e;color:var(--ok);background:rgba(76,208,125,.08)}
svg.i{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
kbd{font-family:inherit;font-size:11px;padding:1px 6px;border-radius:5px;border:1px solid var(--line2);background:var(--raised);color:var(--smoke)}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:44px;min-width:290px;background:var(--raised);border:1px solid var(--line2);border-radius:var(--r2);padding:6px;z-index:40;box-shadow:0 18px 50px rgba(0,0,0,.55);display:none}
.menu.open{display:block}
.menu button{display:flex;width:100%;gap:12px;align-items:flex-start;text-align:left;padding:10px 12px;border:0;background:none;border-radius:9px;cursor:pointer}
.menu button:hover{background:var(--hover)}
.menu button small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.only-m{display:none!important}
.ttw{display:flex;align-items:center;gap:11px;min-width:0}.ttx{min-width:0}
.art{position:relative;flex:none;width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#2a2825,#1b1a18);overflow:hidden;display:grid;place-items:center}
.art svg{width:16px;height:16px;fill:none;stroke:#4a463f;stroke-width:1.6}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}.art img.on{opacity:1}
.art.big{width:52px;height:52px;border-radius:10px}.art.big svg{width:22px;height:22px}
.edt{font-size:9px;color:var(--warn);margin-left:6px;vertical-align:middle}

.tools{display:contents}
/* sidebar */
aside{grid-area:side;border-right:1px solid var(--line);overflow:auto;padding:14px 10px;background:var(--night)}
body.noside aside{display:none}
.side-h{font-size:12px;color:var(--dim);padding:12px 10px 6px;font-weight:500}
.pl{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--smoke);user-select:none;position:relative}
.pl:hover{background:var(--raised);color:var(--bone)}
.pl.active{background:var(--raised);color:var(--bone)}
.pl.active:before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--bone)}
.pl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .ct{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.pl .prog{width:26px;height:3px;border-radius:2px;background:var(--line2);overflow:hidden;flex:none}
.pl .prog i{display:block;height:100%;background:var(--ok)}
.pl.folder{color:var(--dim);font-size:12.5px}
.pl .chev{width:13px;transition:transform .15s}
.pl.collapsed .chev{transform:rotate(-90deg)}
.srcbox{display:grid;gap:6px;padding:4px 0 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
/* toolbar */
.bar{grid-area:bar;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.curpl{font-weight:600;font-size:16px;margin-right:4px;display:flex;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:default}
.search{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:10px;background:var(--raised);border:1px solid var(--line);min-width:200px;flex:0 1 280px}
.search input{border:0;background:none;outline:none;width:100%}
.search:focus-within{border-color:var(--dim)}
.seg{display:flex;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:3px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;cursor:pointer;color:var(--smoke);font-size:12.5px;white-space:nowrap}
.seg button.on{background:var(--bone);color:var(--night);font-weight:600}
.seg button .n{opacity:.6;margin-left:5px;font-variant-numeric:tabular-nums}
.sorts{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sorts .lbl{color:var(--dim);font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 4px 0 10px;border-radius:8px;background:var(--raised);border:1px solid var(--line2);cursor:grab;font-size:12.5px;user-select:none}
.chip .lv{font-size:11px;color:var(--dim)}
.chip .dir,.chip .x{border:0;background:none;cursor:pointer;padding:3px 6px;border-radius:5px}
.chip .x{color:var(--dim)}
.chip .dir:hover,.chip .x:hover{background:var(--hover)}
.chip.drag{opacity:.4}.chip.over{border-color:var(--bone)}
select.add{height:30px;border-radius:8px;background:transparent;border:1px dashed var(--line2);padding:0 8px;color:var(--smoke);font-size:12.5px;cursor:pointer}
/* list */
.hin{display:flex;gap:9px;align-items:baseline;color:var(--dim);font-size:12px;line-height:1.5;padding:22px 20px 0}.empty .hin{padding:26px 0 0}.hin a{color:var(--smoke);text-decoration:none;border-bottom:1px solid var(--line2)}.hin a:hover{color:#E8503A;border-color:#E8503A}.hin small{font-size:10.5px;color:var(--dim);opacity:.85;margin-left:3px}.ember{flex:none;width:6px;height:6px;border-radius:50%;background:#E8503A;opacity:.55;transform:translateY(-1px)}.hin.glow .ember{opacity:1;box-shadow:0 0 10px 2px rgba(232,80,58,.55);animation:ember 1.8s ease-in-out infinite alternate}@keyframes ember{to{opacity:.45;box-shadow:0 0 3px 0 rgba(232,80,58,.3)}}@media (prefers-reduced-motion:reduce){.hin.glow .ember{animation:none}}
/* sound map */
.mapw{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}.maph{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px}canvas#mapCv{width:100%;height:100%;display:block;cursor:pointer;min-height:180px}
main{grid-area:main;overflow:auto;position:relative;overscroll-behavior:contain}
table{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
thead th{position:sticky;top:0;background:rgba(17,16,15,.94);backdrop-filter:blur(8px);z-index:2;text-align:left;font-weight:500;font-size:12px;color:var(--dim);padding:0 8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;height:36px}
thead th:hover{color:var(--bone)}
thead th .si{font-size:11px;color:var(--bone);margin-left:4px}
tbody tr.r td{height:52px;padding:0 8px;border-bottom:1px solid #1b1a18;white-space:nowrap;vertical-align:middle;overflow:hidden}
tbody tr.r:hover td{background:#181715}
tbody tr.r.sel td{background:#211f1c}
tbody tr.r.focus td{background:#24221f}
tbody tr.r.focus td:first-child{box-shadow:inset 3px 0 0 var(--bone)}

<script>
'use strict';
/* ================= utils ================= */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const fmtT=s=>{if(!isFinite(s))return'–';s=Math.max(0,s);const m=Math.floor(s/60),r=Math.floor(s%60);return m+':'+String(r).padStart(2,'0')};
const r1=x=>Math.round(x*10)/10;
const pct=(arr,p)=>{const a=arr.filter(Number.isFinite).sort((x,y)=>x-y);if(!a.length)return 0;return a[Math.min(a.length-1,Math.floor(p*(a.length-1)))]};

  setTimeout(()=>URL.revokeObjectURL(url),10*60*1000)}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const safeName=s=>String(s).replace(/[\/\\:*?"<>|%\x00-\x1f]/g,'-').replace(/^\.+/,'').slice(0,120)||'Playlist';

const ALG_V=13;const APP_V='4.0';

const ENERGY_T=[48,56,63,70];
const DEFAULTS={mixBars:8,mixV:2,loopMax:16,loopBars:8,sens:3,overwrite:false,energyMode:'abs',writeRating:true,writeComment:true,phrase:8,requireConfirm:true,maxMin:20,mixTarget:'outro',playOnDrop:true};

const LBL={A:'A',B:'B',D:'D',X:'F',F:'G',G:'H',L:'Loop'};const KEY2CUE={A:'A',B:'B',D:'D',F:'X',G:'F',H:'G',L:'L'};
const HOT=['A','B','D','X','F','G'],MK=[...HOT,'L'],T1=16; // hot cues in slot order; first transition is always 16 bars
const PAIR={D:'X',X:'D',F:'G',G:'F'};
const ERR={nofile:'Audiodatei nicht gefunden',decode:'Datei nicht lesbar',nogrid:'Kein Beatgrid',grid:'Beatgrid unbrauchbar',toolong:'Zu lang',mem:'Zu wenig Speicher',other:'Analyse fehlgeschlagen'};
const FIX={nofile:'Musikordner bzw. Stick (neu) verbinden. Liegt die Datei woanders, den passenden Ordner wählen.',decode:'Format oder Datei defekt. In rekordbox abspielen; falls ok, als MP3 320 / WAV neu exportieren.',nogrid:'Track in rekordbox analysieren (Beatgrid), Library neu exportieren.',grid:'Beatgrid in rekordbox prüfen/korrigieren und neu exportieren.',toolong:`Vermutlich ein DJ-Mix. Wird bewusst übersprungen (Limit in den Einstellungen).`,mem:'Browser-Tab neu laden und weniger Tracks auf einmal analysieren.',other:'„Erneut versuchen“. Bleibt der Fehler, Track in rekordbox prüfen.'};
class AErr extends Error{constructor(code,msg){super(msg||ERR[code]);this.code=code}}

/* ================= keys ================= */
const KEY2CAM={'Abm':'1A','G#m':'1A','Ebm':'2A','D#m':'2A','Bbm':'3A','A#m':'3A','Fm':'4A','Cm':'5A','Gm':'6A','Dm':'7A','Am':'8A','Em':'9A','Bm':'10A','F#m':'11A','Gbm':'11A','Dbm':'12A','C#m':'12A',
'B':'1B','Cb':'1B','F#':'2B','Gb':'2B','Db':'3B','C#':'3B','Ab':'4B','G#':'4B','Eb':'5B','D#':'5B','Bb':'6B','A#':'6B','F':'7B','C':'8B','G':'9B','D':'10B','A':'11B','E':'12B'};
const CAM2KEY={'1A':'Abm','2A':'Ebm','3A':'Bbm','4A':'Fm','5A':'Cm','6A':'Gm','7A':'Dm','8A':'Am','9A':'Em','10A':'Bm','11A':'F#m','12A':'Dbm','1B':'B','2B':'F#','3B':'Db','4B':'Ab','5B':'Eb','6B':'Bb','7B':'F','8B':'C','9B':'G','10B':'D','11B':'A','12B':'E'};
function parseKey(raw){
  if(!raw)return null;let s=String(raw).trim().replace('♯','#').replace('♭','b');

  const c=KEY2CAM[s];return c?{n:parseInt(c),l:c.slice(-1)}:null;
}

/* ================= settings & storage ================= */
let S={...DEFAULTS};
try{Object.assign(S,JSON.parse(localStorage.getItem('jailr-prep-settings')||'{}'))}catch(e){}
if(S.mixV!==2){S.mixBars=8;S.mixV=2} // v2.5: Fenster wird in Beats gedacht, Standard 32 Beats
function saveS(){ACC.mark('settings','main');try{localStorage.setItem('jailr-prep-settings',JSON.stringify(S))}catch(e){}}
const IDB={db:undefined,
  open(){if(this.db!==undefined)return Promise.resolve(this.db);return new Promise(res=>{try{const r=indexedDB.open('jailr-prep',3);r.onupgradeneeded=()=>{for(const n of['analysis','manual','handles','sets'])if(!r.result.objectStoreNames.contains(n))r.result.createObjectStore(n)};r.onsuccess=()=>{this.db=r.result;this.db.onversionchange=()=>{this.db.close();this.db=undefined};res(this.db)};r.onblocked=()=>toast('JAILR Prep ist noch in einem anderen Tab offen. Bitte den anderen Tab schließen.',1);r.onerror=()=>{this.db=null;res(null)}}catch(e){this.db=null;res(null)}})},
  async all(st){const db=await this.open();const m=new Map();if(!db)return m;return new Promise(res=>{try{const q=db.transaction(st).objectStore(st).openCursor();q.onsuccess=()=>{const c=q.result;if(c){m.set(c.key,c.value);c.continue()}else res(m)};q.onerror=()=>res(m)}catch(e){res(m)}})},
  async get(st,k){const db=await this.open();if(!db)return null;return new Promise(res=>{try{const q=db.transaction(st).objectStore(st).get(k);q.onsuccess=()=>res(q.result??null);q.onerror=()=>res(null)}catch(e){res(null)}})},
  async put(st,k,v){if(st==='manual')ACC.mark('track',k);else if(st==='sets')ACC.mark('set',k);const db=await this.open();if(!db)return;return new Promise(res=>{try{const tx=db.transaction(st,'readwrite');v==null?tx.objectStore(st).delete(k):tx.objectStore(st).put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>res()}catch(e){res()}})}
};
const mKey=t=>nfc(t.fname).toLowerCase()+'|'+t.size;
const aKey=t=>ALG_V+'|'+mKey(t)+'|'+(t.tempos[0]?t.tempos[0].t.toFixed(3)+'@'+t.tempos[0].bpm:'-');

/* ================= state ================= */
const state={source:null,libName:'',volName:'',tracks:new Map(),order:[],playlists:[],tree:[],cur:-1,collapsed:new Set(),
  sort:[{k:'idx',d:1}],filter:'all',q:'',view:[],idxOf:new Map(),sel:new Set(),focus:null,anchor:null,
  files:new Map(),byRel:new Map(),fileCount:0,busy:false,cancel:false,refLufs:null};
window.APP=state;
function mkTrack(o){
  const t=Object.assign({id:'',el:null,title:'',artist:'',album:'',genre:'',bpm:0,keyRaw:'',dur:0,size:0,rating:0,comments:'',loc:'',path:'',fname:'',kind:'',kbps:0,srate:0,
    tempos:[],marks:[],analysis:null,manual:null,file:null,fileAmb:false,status:'idle',errCode:'',error:''},o);
  t.key=parseKey(t.keyRaw);t.cam=t.key?t.key.n+t.key.l:'';t.keyName=t.key?(CAM2KEY[t.cam]||t.keyRaw):t.keyRaw;
  return t;
}
function resetLib(){stop();REDO.length=0;PB.last=null;state.lib=null;state.locSet=new Set();state.tracks.clear();state.order=[];state.playlists=[];state.tree=[];state.sel.clear();state.focus=null;HIST.length=0}

/* ================= import: rekordbox XML ================= */
function locToPath(loc){let s=loc||'';s=s.replace(/^file:\/\/localhost/i,'').replace(/^file:\/\//i,'');try{s=decodeURIComponent(s)}catch(e){}if(/^\/[A-Za-z]:\//.test(s))s=s.slice(1);return nfc(s)}
function parseLib(text){
  if(/<!DOCTYPE|<!ENTITY/i.test(text.slice(0,4096)))throw new Error('XML mit DOCTYPE/ENTITY wird aus Sicherheitsgründen nicht geladen. Bitte direkt aus rekordbox exportieren.');
  const doc=new DOMParser().parseFromString(text,'application/xml');
  if(doc.querySelector('parsererror')||!doc.querySelector('DJ_PLAYLISTS'))throw new Error('Das ist keine gültige rekordbox-XML-Datei.');
  const tracks=[],byLoc=new Map();
  for(const el of doc.querySelectorAll('COLLECTION > TRACK')){
    const g=a=>el.getAttribute(a)||'';const path=locToPath(g('Location'));
    const t=mkTrack({id:g('TrackID'),el,title:g('Name')||path.split('/').pop(),artist:g('Artist'),album:g('Album'),genre:g('Genre'),bpm:+g('AverageBpm')||0,keyRaw:g('Tonality'),
      dur:+g('TotalTime')||0,size:+g('Size')||0,rating:+g('Rating')||0,comments:g('Comments'),loc:g('Location'),path,fname:path.split('/').pop(),kind:g('Kind'),kbps:+g('BitRate')||0,srate:+g('SampleRate')||0,
      tempos:[...el.querySelectorAll('TEMPO')].map(x=>({t:+x.getAttribute('Inizio'),bpm:+x.getAttribute('Bpm'),beat:+(x.getAttribute('Battito')||1)})).filter(x=>x.bpm>0&&isFinite(x.t)),
      marks:[...el.querySelectorAll('POSITION_MARK')].map(x=>({num:+x.getAttribute('Num'),type:+x.getAttribute('Type'),start:+x.getAttribute('Start'),end:x.hasAttribute('End')?+x.getAttribute('End'):null,name:x.getAttribute('Name')||''}))});
    if(!t.id)continue;tracks.push(t);byLoc.set(g('Location'),t.id)}
  return{doc,tracks,byLoc,product:doc.querySelector('PRODUCT')?.getAttribute('Version')||''}}
const isStickLoc=loc=>/^file:\/\/(localhost)?\/Volumes\//i.test(loc||'');
function libInfo(lib){ // is this really the collection – or one of our own exports / a stick-based file?
  const files=lib.tracks.filter(t=>/^file:\/\/(localhost)?\//i.test(t.loc)),stick=files.filter(t=>isStickLoc(t.loc)).length;
  const own=[...lib.doc.querySelectorAll('PLAYLISTS NODE')].some(n=>n.getAttribute('Name')==='JAILR Prep')&&lib.doc.querySelectorAll('PLAYLISTS NODE[Type="1"]').length<=2;
  return{own,stick,files:files.length,stickMost:files.length>0&&stick/files.length>0.5}}
function loadXml(text,name){
  const lib=parseLib(text),doc=lib.doc,byLoc=lib.byLoc;
  if(state.source==='usb'&&state.tracks.size){attachLib(lib,name);return}
  resetLib();state.source='xml';state.libName=name;state.product=lib.product;state.libInfo=libInfo(lib);
  for(const t of lib.tracks){if(!state.tracks.has(t.id))state.order.push(t.id);state.tracks.set(t.id,t);state.locSet.add(t.loc)}
  const walk=(node,depth,path)=>{for(const ch of [...node.children].filter(c=>c.tagName==='NODE')){const nm=ch.getAttribute('Name')||'';
    if(ch.getAttribute('Type')==='0'){const fp=[...path,nm];state.tree.push({type:'folder',name:nm,depth,key:fp.join('/')});walk(ch,depth+1,fp)}
    else{const kt=ch.getAttribute('KeyType');const ids=[...ch.children].filter(c=>c.tagName==='TRACK').map(c=>kt==='1'?byLoc.get(c.getAttribute('Key')):c.getAttribute('Key')).filter(id=>state.tracks.has(id));
      const idx=state.playlists.length;state.playlists.push({name:nm,folder:path,ids});state.tree.push({type:'list',name:nm,depth,idx,parent:path.join('/')})}}};
  const root=doc.querySelector('PLAYLISTS > NODE');if(root)walk(root,0,[]);
  afterLoad();
  if(state.libInfo.own||state.libInfo.stickMost)setTimeout(()=>openModal('libwarn'),900);
}
/* Stick as source: every track is tied to its entry in the real collection (same Location, TrackID, cues, grid), so rekordbox never sees a second copy */
function attachLib(lib,name){
  const inf=libInfo(lib);if(inf.own||inf.stickMost){state.libInfo=inf;openModal('libwarn',{attach:1});return}
  const stem=n=>nfc(n).toLowerCase().replace(/\.[a-z0-9]{2,4}$/,'').trim(),norm=x=>nfc(x).toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim(),ext=n=>(n.split('.').pop()||'').toLowerCase();
  const byName=new Map(),byTitle=new Map(),add=(m,k,t)=>{if(!k)return;if(!m.has(k))m.set(k,[]);m.get(k).push(t)};
  for(const l of lib.tracks){if(!/^file:\/\/(localhost)?\//i.test(l.loc)||isStickLoc(l.loc))continue;add(byName,nfc(l.fname).toLowerCase(),l);add(byTitle,norm(l.title)+'|'+norm(l.artist),l)}
  state.lib={name,n:lib.tracks.length,tracks:lib.tracks};state.locSet=new Set(lib.tracks.map(t=>t.loc));state.product=lib.product;
  let ok=0;const used=new Map();
  for(const t of state.tracks.values()){
    const near=l=>!l.dur||!t.dur||Math.abs(l.dur-t.dur)<=2,pick=c=>{c=(c||[]).filter(near);if(c.length>1&&t.size)c=c.filter(l=>l.size===t.size).length?c.filter(l=>l.size===t.size):c;return c.length===1?c[0]:null};
    let l=pick(byName.get(nfc(t.fname).toLowerCase()));
    if(!l){const s=stem(t.fname);if(s.length>=12){const c=[];for(const[k,arr]of byName)if(ext(k)===ext(t.fname)&&stem(k).startsWith(s))c.push(...arr);l=pick(c)}}
    if(!l)l=pick(byTitle.get(norm(t.title)+'|'+norm(t.artist)));

  scanMsg(true,'Ordner wird gelesen…');
  try{
    const sp=await stickParts(h);const tick=(a,b)=>scanMsg(true,`${a} von ${b} Dateien…`);
    if(sp.pio||sp.con){
      const pre=sp.root?sp.root.name+'/':'',files=[];
      if(sp.pio)files.push(...await walkDir(sp.pio,pre+'PIONEER/',p=>/PIONEER\/(rekordbox\/export\.pdb|USBANLZ\/.+\.(DAT|EXT)|Artwork\/.+\.(jpg|png))$/i.test(p),tick));
      if(sp.con)files.push(...await walkDir(sp.con,pre+'Contents/',p=>AUDIO_RE.test(p),tick));
      else if(sp.root)files.push(...await walkDir(sp.root,pre,p=>AUDIO_RE.test(p)&&!/(^|\/)(PIONEER|_JAILR Serato)\//.test(p),tick));
      if(remember)await DIRS.save(sp.root||h);scanMsg(false);state.stickHandle=sp.root||h;
      await handleFiles(files,sp.root?sp.root.name:'');
      if(sp.pio&&!sp.con&&!sp.root&&state.source==='usb'&&!files.some(f=>AUDIO_RE.test(f.name)))openModal('needdir',{what:'Contents',h});
      else if(sp.con&&!sp.pio&&!state.source)openModal('needdir',{what:'PIONEER',h});
      return}
    const files=await walkDir(h,h.name+'/',p=>AUDIO_RE.test(p)||/\.xml$/i.test(p)&&p.split('/').length<=3,tick);scanMsg(false);
    const audio=files.filter(f=>AUDIO_RE.test(f.name));if(!audio.length){toast('In diesem Ordner liegt keine Musik und kein rekordbox-Stick.',1);return}
    if(remember)await DIRS.save(h);await handleFiles(audio);
  }catch(e){toast('Ordner konnte nicht gelesen werden: '+(e.message||e.name),1)}finally{scanMsg(false)}
}
async function pickDir(startIn){
  if(picking)return;picking=true;
  try{const o={id:'jailr-music',mode:'read'};if(startIn)o.startIn=startIn;const h=await window.showDirectoryPicker(o);await openDir(h)}
  catch(e){if(e.name!=='AbortError')toast(e.name==='SecurityError'?'Dieser Ordner ist vom Browser gesperrt. Bitte den Stick oder den Musikordner selbst wählen.':'Auswahl fehlgeschlagen: '+e.message,1)}
  finally{picking=false}
}
async function reconnect(i){const h=DIRS.list[i];if(!h)return;try{let p=await h.queryPermission({mode:'read'});if(p!=='granted')p=await h.requestPermission({mode:'read'});if(p!=='granted'){toast('Zugriff nicht erlaubt.');return}await openDir(h,false)}catch(e){toast(`„${h.name}“ ist gerade nicht erreichbar – Stick eingesteckt?`,1)}}

    if(fl)v=dv.getFloat32(o,le);else if(bps===2)v=dv.getInt16(o,le)/32768;
    else if(bps===3){const b0=dv.getUint8(o),b1=dv.getUint8(o+1),b2=dv.getUint8(o+2);let x=le?(b2<<16|b1<<8|b0):(b0<<16|b1<<8|b2);if(x&0x800000)x-=0x1000000;v=x/8388608}

async function decodeFile(file,targetSr){
  let ab;try{ab=await file.arrayBuffer()}catch(e){throw new AErr('nofile','Datei konnte nicht gelesen werden (entfernt oder Stick getrennt?)')}
  try{const ctx=targetSr?new OfflineAudioContext(2,1,targetSr):getCtx();return await ctx.decodeAudioData(ab.slice(0))}
  catch(e){
    if(e instanceof RangeError||/memory/i.test(e.message||''))throw new AErr('mem');
    if(!/\.aif/i.test(file.name))throw new AErr('decode',`Format nicht dekodierbar (.${(file.name.split('.').pop()||'').toLowerCase()})`);
    const a=parseAiff(ab);const buf=getCtx().createBuffer(a.ch.length,a.frames,a.sr);a.ch.forEach((d,i)=>buf.copyToChannel(d,i));

  for(const p of cu)for(const r of p.rows){if(r.act==='neu')nNew++;else if(r.act==='ersetzt')nRep++;else if(r.act==='bleibt')nKeep++}
  const fmt=x=>x==null?'–':fmtT(x),old=cx.plans.reduce((n,p)=>n+p.t.marks.length,0);
  const rows=cx.plans.map(p=>{const rt=p.ratingNew!=null?`${p.ratingOld}★→${p.ratingNew}★`:'–',cm=p.changed&&S.writeComment?esc(withTag(p.t.comments,commentTag(p.t))):'–';
    return p.cues?`<tr><td>${esc(p.t.title)}</td>${p.rows.map(r=>`<td><span class="${r.act==='neu'?'neu':r.act==='ersetzt'?'ers':'blb'}" ${r.act==='übersprungen'?`title="${esc(r.why||'')}"`:''}>${LBL[r.k]} ${r.act==='bleibt'?'bleibt '+fmt(r.old):r.act==='übersprungen'?'übersprungen':r.act==='keine'?'–':r.act==='ersetzt'&&r.old!=null?fmt(r.old)+'→'+fmt(r.nw):fmt(r.nw)}</span></td>`).join('')}<td>${rt}</td><td>${cm}</td></tr>`
    :`<tr><td>${esc(p.t.title)}</td><td colspan="7">${hasMeta(p.t)?'<span class="ers">Infos geändert</span>, ':''}<span class="${p.cueReason==='Cues aus'?'blb':'skip'}">${esc(p.cueReason||p.reason)}</span></td><td>${rt}</td><td>${cm}</td></tr>`}).join('');
  return`<div class="sum"><div><b>${cu.length}</b><span>Tracks mit Cues</span></div><div><b>${nNew}</b><span>neue Cues</span></div><div><b>${nRep}</b><span>ersetzte Cues</span></div><div><b>${old}</b><span>eigene Cues bleiben</span></div></div>${cx.plans.some(p=>p.grid)?`<div class="note">${cx.plans.filter(p=>p.grid).length} Beatgrids werden korrigiert.</div>`:''}
    ${cx.excluded&&cx.excluded.length?`<div class="note err"><b>${cx.excluded.length} Tracks</b> stehen nicht in deiner Collection und kommen nicht in die XML, sonst würde rekordbox sie doppelt anlegen: ${esc(cx.excluded.slice(0,4).map(p=>p.t.title).join(', '))}${cx.excluded.length>4?' …':''}</div>`:''}
    ${un.length?`<div class="note warn">${un.length} Tracks bekommen keine neuen Cues (unsicher und nicht bestätigt, oder Prüfung nicht bestanden). Sie bleiben mit ihrem bisherigen Stand in der Playlist.</div>`:''}
    ${!cu.length&&cx.plans.some(p=>p.t.analysis)?'<div class="note">Cues sind für diese Tracks aus. Exportiert werden nur Energie, Kommentar und Reihenfolge. Cues schaltest du über „Cues (Playlist)“ oder pro Track ein.</div>':''}
    <details class="mo"><summary>Alle Änderungen ansehen</summary><div class="diff"><table><thead><tr><th>Track</th><th>A</th><th>B</th><th>D</th><th>F</th><th>G</th><th>H</th><th>Loop</th><th>Rating</th><th>Kommentar</th></tr></thead><tbody>${rows}</tbody></table></div></details>`}

}
let tourDj='rb';
const TOUR=[
 {t:'Laden',b:()=>`<ol class="guide"><li><b>Collection:</b> rekordbox → <b>Datei → Collection im xml-Format exportieren</b>, hier öffnen.</li><li><b>Musik:</b> Musikordner oder Stick verbinden. ${dirApi()?'Dein Browser fragt nur nach Lesezugriff.':'In Chrome oder Edge geht das ohne die Frage „Dateien hochladen?“.'}</li></ol>
  <p>Nur der Stick? Geht auch, egal ob du den Stick, PIONEER oder Contents anklickst. Für den Rückweg nach rekordbox lädst du einmal die Collection dazu, dann entstehen keine Duplikate.</p>
  <div class="note">Nichts verlässt deinen Rechner. Deine eigenen Cues bleiben.</div>`},
 {t:'Analysieren und Hinweise',b:`<p>Playlist wählen, <b>Analysieren</b> (oder <kbd>Enter</kbd>). Danach steht bei jedem Track, was zu tun ist:</p>
  <ol class="guide"><li><b>Fertig</b>: nichts mehr.</li><li><b>Quantize prüfen</b>: Das Beatgrid liegt daneben, läuft weg oder Takt 1 stimmt nicht. <b>Klick anhören</b>, dann <b>Grid korrigieren</b>.</li><li><b>Cues bestätigen / prüfen</b>: kurz anhören, dann „Passt so“.</li><li><b>Qualität</b> und <b>Lautheit prüfen</b>: schlechte Datei oder stark abweichender Pegel.</li></ol><p>Der Filter <b>Prüfen</b> zeigt nur diese Tracks.</p>`},
 {t:'Cues',b:`<div class="cuemap"><span class="on" style="background:var(--cA)">A<small>Start</small></span><span class="on" style="background:var(--cB)">B<small>Bass Swap</small></span><span>C</span><span class="on" style="background:var(--cD)">D<small>Trans. 1</small></span><span>E</span><span class="on" style="background:var(--cX)">F<small>Ende 1</small></span><span class="on" style="background:var(--cF)">G<small>Trans. 2</small></span><span class="on" style="background:var(--cG)">H<small>Ende 2</small></span></div>
  <p><b>A</b> Start, <b>B</b> spätestens drin sein (Bass Swap), <b>D → F</b> erste Transition über 16 Takte, <b>G → H</b> zweite.</p>
  <ol class="guide"><li>Einschalten: Schalter <b>Cues</b> oben für die ganze Playlist oder „+ Cues“ am Track.</li><li><b>Leertaste</b> spielt und stoppt. <kbd>A</kbd> <kbd>B</kbd> <kbd>D</kbd> <kbd>F</kbd> <kbd>G</kbd> <kbd>H</kbd> <kbd>L</kbd> springen zum Marker.</li><li>Anpassen: ziehen, <kbd>←</kbd> <kbd>→</kbd> oder die Knöpfe. <kbd>⌘Z</kbd> macht rückgängig.</li><li>Der <b>Emergency Loop</b> liegt hinter H, damit er als Active Loop erst am Ende greift.</li><li><b>Karte</b> oben in der Leiste zeigt deine Playlist nach Klang: Was nah beieinander liegt, klingt ähnlich.</li></ol>`},
 {t:'Set planen',b:`<ol class="guide"><li>Oben auf <b>Set-Planer</b>. Playlist, Dauer und Kurve wählen, <b>Set vorschlagen</b>.</li><li>Zwischen den Tracks steht, warum es passt, z. B. „8A → 9A · +2 BPM · Energie +1“.</li><li>Ziehen sortiert um, das Schloss fixiert. Ein Klick auf einen Track zeigt, was danach, davor oder stattdessen passt.</li><li>Das <b>▶</b> zwischen zwei Tracks spielt den fertigen Übergang: im Takt, mit Bass Swap auf B und Ausstieg auf H. <b>Übergänge anhören</b> spielt alle nacheinander.</li><li><b>Teilen</b> macht aus dem Set einen Link. Wer ihn öffnet, sieht die Tracks und welche davon in der eigenen Library liegen. Musik wird nicht geteilt.</li><li>Alles Weitere (Intro, Outro, Toleranz, Boost) steckt unter <b>Mehr Optionen</b>.</li></ol>`},
 {t:'Set Master',b:`<p>Oben auf <b>Set Master</b>: macht eine rekordbox-Aufnahme fertig zum Hochladen.</p><ol class="guide"><li><b>Aufnahme wählen:</b> WAV und CUE zusammen. Sie liegen unter Musik/rekordbox/Recording.</li><li><b>Ansehen:</b> Lautheit über die Zeit, übersteuerte Stellen, Lücken. Jede Lücke kannst du vorher und nachher anhören und einzeln abschalten.</li><li><b>Rendern:</b> Start, Ziel-Lautheit und Übergang wählen. Du bekommst WAV, CUE, Tracklist und einen Report.</li></ol><div class="note">Das ist eine Reparatur im fertigen Stereo-Mix: Echo-Füllung statt echtem Übergang. Clipping lässt sich nur begrenzen, nicht rückgängig machen.</div>`},
 {t:'Exportieren',b:()=>`<div class="seg"><button data-dj="rb" class="${tourDj==='rb'?'on':''}">rekordbox</button><button data-dj="se" class="${tourDj==='se'?'on':''}">Serato</button></div>`+(tourDj==='rb'?`
  <ol class="guide"><li><b>Export → rekordbox XML</b>. ${xmlApi()?'Beim ersten Mal Speicherort wählen, danach wird dieselbe Datei überschrieben.':'Die alte „JAILR Prep.xml“ vorher löschen. In Chrome und Edge geht das automatisch.'}</li>
  <li>Einmal in rekordbox: <b>Voreinstellungen → Erweitert → Datenbank → rekordbox xml</b> → die Datei wählen. Und unter <b>Betrachten → Layout</b> „rekordbox xml“ anhaken.</li>
  <li>Links <b>rekordbox xml → ↻</b>, Tracks markieren, Rechtsklick → <b>In Sammlung importieren</b>.</li><li>Rechtsklick auf die Playlist → <b>Wiedergabeliste importieren</b>. Nicht über Datei → Importieren.</li><li><b>Active Loops:</b> nach dem Export auf den Stick hier <b>Export → Active Loops auf dem Stick</b>.</li></ol>`:`
  <ol class="guide"><li><b>Export → Serato</b>, Playlists wählen, bei Bedarf <b>„Mit Cues“</b>.</li><li>Stick oder Platte wählen. Crates und Cues werden direkt geschrieben.</li><li>Serato öffnen: A liegt auf Cue 1, G und H auf 7 und 8, dazu der Loop.</li></ol><div class="note">Cues gehen nur in MP3-Dateien.</div>`)}

function fileBox(){
  if(!xmlApi())return`<div class="note warn">Dieser Browser kann keine feste Datei überschreiben. Die XML landet als <b>JAILR Prep.xml</b> im Download-Ordner. Damit rekordbox sie findet: <b>alte „JAILR Prep.xml“ vorher löschen</b> oder die neue Datei („JAILR Prep (1).xml“) so umbenennen und die alte ersetzen. Mit Chrome oder Edge geht das automatisch.</div>`;

  }else if(kind==='shareopen'){h=`<h2>Geteiltes Set öffnen</h2><div class="body"><div class="shl"><input class="inp" id="shIn" placeholder="Link einfügen" aria-label="Link einfügen"><button class="btn primary" data-sh="paste">Öffnen</button></div><input type="file" id="shFile" accept=".json,application/json" hidden></div><div class="foot"><button class="btn ghost" data-close>Abbrechen</button><button class="btn" data-sh="pick">Datei wählen</button></div>`;

  setManual(t,{meta});applyMeta(t);closeModal();renderAll();toast(reset?'Original wiederhergestellt':'Infos gespeichert – gehen beim nächsten Export mit')}

const HIT=()=>matchMedia('(pointer:coarse)').matches?22:10;let tlDown=null;
const KS=['G','F','X','D','B','A','L'];
/* pointer handling shared by the overview (bars, magnetic to phrase starts) and the zoom view (beats) */
function bindMarkers(cv,G){ // G() → {t,a,c,w,x(pos),pos(x,e)}
  const hitAt=(g,mx,my)=>{const hs=KS.filter(k=>g.c[k]!=null).map(k=>({k,d:Math.abs(g.x(g.c[k])-mx)+(my<24?-6:0)+(TL.sel===k?-3:0)})).filter(o=>o.d<HIT()).sort((p,q)=>p.d-q.d);return hs[0]};
  let pre=null,moved=false;
  cv.addEventListener('pointerdown',e=>{if(e.button)return;const g=G();if(!g||!g.a)return;const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,hit=hitAt(g,mx,my);
    if(hit){TL.editId=g.t.id;TL.drag=hit.k;TL.dx=g.x(g.c[hit.k])-mx;TL.zc=g.mid;if(TL.sel!==hit.k&&cv.id==='tl'){TL.sel=hit.k;TL.resel=true}else TL.sel=hit.k;pre=cloneM(g.t.manual);moved=false;cv.setPointerCapture(e.pointerId);e.preventDefault();drawTL()}
    else tlDown={x:mx,y:e.clientY,t:Date.now()}});
  cv.addEventListener('touchstart',e=>{if(TL.drag)e.preventDefault()},{passive:false});
  cv.addEventListener('pointermove',e=>{const g=G();if(!g||!g.a)return;const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,tip=$('#tlTip');
    if(TL.drag){const k=TL.drag,b=g.pos(mx+(TL.dx||0),e,k);if(g.c[k]!==b){const p=markerPatch(g.t,k,b);t_set(g.t,p);moved=true}
      const ph=g.c.bnd.includes(b);tip.style.display='block';tip.style.left=Math.min(r.width-170,Math.max(4,mx+24))+'px';tip.textContent=`${LBL[k]} · ${posTxt(b)} · ${fmtT(barT(g.a,b))}${ph?' · Phrasenstart':''}`;return}
    if(e.pointerType==='mouse'){const my=e.clientY-r.top;cv.style.cursor=hitAt(g,mx,my)?'ew-resize':'crosshair';
      if(cv.id==='tl'){TL.hover=g.pos(mx,e);tip.style.display='block';tip.style.left=Math.min(r.width-120,mx+28)+'px';tip.textContent=`${posTxt(TL.hover)} · ${fmtT(barT(g.a,TL.hover))}`;drawTL()}}});
  const end=e=>{const g=G();$('#tlTip').style.display='none';
    if(TL.drag){const k=TL.drag;TL.drag=null;TL.zc=null;if(g&&moved){pushHist([{id:g.t.id,m:pre}]);IDB.put('manual',mKey(g.t),g.t.manual);refreshTrack(g.t);previewMarker(g.t,k);tlDown=null;return}
      if(g){renderDetail();if(e.type==='pointerup')jump(k)}tlDown=null;return}
    if(tlDown&&g&&g.a&&e.type==='pointerup'){const mx=e.clientX-cv.getBoundingClientRect().left;if(Math.abs(mx-tlDown.x)<6&&Math.abs(e.clientY-tlDown.y)<10)play(cv.id==='tl'&&mx<=3?0:barT(g.a,g.pos(mx,e)),null,g.t.id)}tlDown=null};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  cv.addEventListener('pointerleave',()=>{if(!TL.drag&&TL.hover>=0){TL.hover=-1;$('#tlTip').style.display='none';drawTL()}})}
bindPlan();bindSm();
bindMarkers(cv,()=>{const g=tlGeom();if(!g.a)return null;const c=computeCues(g.t);return{t:g.t,a:g.a,c,mid:c[TL.sel],x:b=>g.x(barT(g.a,b)),pos:(mx,e,k)=>{const sec=clamp(g.s(mx),0,g.dur);if(e.altKey)return nearestPos(g.a,sec,0.25);let b=nearestPos(g.a,sec,1);if(k&&!e.shiftKey){let bd=9,bb=b;for(const x of c.bnd){const d=Math.abs(g.x(barT(g.a,x))-mx);if(d<bd){bd=d;bb=x}}b=bb}return clamp(b,0,k==='L'?g.a.rms.length-1:g.a.rms.length)}}});
function bindZoom(){const z=$('#tlz');if(!z)return;bindMarkers(z,()=>{const g=zGeom();if(!g)return null;return{t:g.t,a:g.a,c:g.c,mid:g.mid,x:g.x,pos:(mx,e,k)=>clamp(Math.round(g.b(mx)*4)/4,0,k==='L'?g.a.rms.length-1:g.a.rms.length)}})}

document.addEventListener('keydown',e=>{
  if($('#modalBg').classList.contains('on')){if(e.key==='Escape')closeModal();if(e.key==='Tab'){const f=$$('#modal input,#modal select,#modal button').filter(x=>!x.disabled&&x.offsetParent);if(f.length){const i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}}}return}
  if(e.target.matches('input,select,textarea')){if(e.key==='Escape')e.target.blur();return}
  if(!state.source)return;const v=state.view;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();if(PLAN.on)e.shiftKey?planStep(PLAN.redo,PLAN.hist):planStep(PLAN.hist,PLAN.redo);else e.shiftKey?redo():undo();return}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return}
  if(e.key===' '&&!SM.on&&!e.metaKey&&!e.ctrlKey&&!e.altKey){if(e.target.closest&&e.target.closest('button,[role=button],[tabindex]')&&e.target.matches(':focus-visible')&&!e.target.closest('tr,canvas,.pi'))return;e.preventDefault();togglePlay();return}
  if(SM.on){smKey(e);return}
  if(PLAN.on){planKey(e);return}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='a'){e.preventDefault();state.sel=new Set(v);updateSel();return}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();let i=v.indexOf(state.focus);i=e.key==='ArrowDown'?Math.min(v.length-1,i+1):Math.max(0,i-1);if(i<0)i=0;const id=v[i];if(!id)return;
    if(e.shiftKey)state.sel.add(id);else{state.sel=new Set([id]);state.anchor=id}stop();state.focus=id;scrollToId(id);updateSel();renderDetail();return}
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){if(!state.focus)return;e.preventDefault();moveMarker(TL.sel,(e.key==='ArrowRight'?1:-1)*(e.shiftKey?8:e.altKey?0.25:1));return}
  if(e.key==='Enter'){if(e.target.closest('button'))return;analyzeIds(state.sel.size?[...state.sel]:v);return}
  if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key.toUpperCase();
  if(KEY2CUE[k]){jump(KEY2CUE[k]);return}
  if(k==='C'){const t=state.tracks.get(state.focus);if(t&&t.analysis){setManual(t,{ok:true,cue:true});toast('Cues an und bestätigt: '+t.title,0,1)}return}
  if(k==='K'){CLICK.on=!CLICK.on;renderDetail();toast(CLICK.on?'Klick an':'Klick aus');return}
  if(k==='R'){const t=state.tracks.get(state.focus);if(t&&t.manual)resetMarkers(t);return}
  if(e.key==='/'){e.preventDefault();$('#q').focus();return}if(e.key==='?'){openModal('guide');return}if(e.key==='Escape'){state.sel.clear();updateSel()}});
